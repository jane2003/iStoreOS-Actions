name: 💿 St1_Build-Rootfs-release
on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      build_version:
        description: "1、请选择构建版本"
        required: true
        default: '20260731'
        type: choice
        options:
          - '20260731'
          - '20260703'
          - '20260605'
          - '20260417'
      network_settings:
        description: "2、请选择初始网络配置"
        required: true
        default: 'static'
        type: choice
        options:
          - 'static'
          - 'dhcp'
      ipaddr:
        description: '3、请输入管理IP（选择static时必填）'
        required: true
        default: '192.168.2.2'
      gateway:
        description: '4、请输入默认网关（选择static时必填）'
        required: true
        default: '192.168.2.1'

env:
  VERSION: 24.10.8
  BUILD_VERSION: ${{ inputs.build_version || '20260731' }}
  NETWORK_SETTINGS: ${{ inputs.network_settings || 'static' }}
  IPADDR: ${{ inputs.ipaddr || '192.168.2.2' }}
  GATEWAY: ${{ inputs.gateway || '192.168.2.1' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: ⚙️ 设置可执行权限
      run: | 
        chmod +x arm64/build24.sh
        chmod +x shell/*.sh

    - name: ⚙️ 设置IP、网关和版本号
      run: |
        sed -i "s/版本号/${{ env.VERSION }}/g" "./files/etc/uci-defaults/99-custom.sh"
        sed -i "s/版本号/${{ env.VERSION }}/g" "./files/etc/banner"
        echo "当前网络配置路径"
        CONFIG_PATH="./files/etc/uci-defaults/99-custom.sh"
        echo $CONFIG_PATH
        if [ "${{ env.NETWORK_SETTINGS }}" = "static" ]; then
           echo "删除网络设置-dhcp"
           sed -i '34,111d' "$CONFIG_PATH"
           echo "替换默认配置"
           sed -i "/ipaddr/s/192.168.5.88/${{ env.IPADDR }}/g" "$CONFIG_PATH"
           sed -i "/gateway/s/192.168.5.1/${{ env.GATEWAY }}/g" "$CONFIG_PATH"
        else
           echo "删除网络设置-static"
           sed -i '26,32d' "$CONFIG_PATH"
        fi
        echo "输出配置"
        cat $CONFIG_PATH

    - name: ⏬ 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev zstd curl unzip tree

    - name: ⏬ 下载 ImageBuilder
      run: |
        curl -L -o imagebuilder.tar.zst https://github.com/Kwonelee/iStoreOS-Actions/releases/download/iStoreOS-ImageBuilder/${{ env.BUILD_VERSION }}-istoreos-imagebuilder-armsr-armv8.Linux-x86_64.tar.zst
        tar --use-compress-program=unzstd -xvf imagebuilder.tar.zst
        mv istoreos-imagebuilder-* imagebuilder

    - name: ⏬ 复制并设置必备文件
      run: |
        cp arm64/build24.sh imagebuilder/
        #cp arm64/{Makefile,repositories.conf} imagebuilder/
        cp shell/*-packages.sh imagebuilder/
        find files/packages/ -name "*.ipk" -exec cp {} imagebuilder/packages/ \;
        
        mkdir -p imagebuilder/files/etc/{uci-defaults,banner1}
        # 添加开机启动脚本
        cp files/etc/uci-defaults/99-custom.sh imagebuilder/files/etc/uci-defaults/
        
        # 替换O大打包脚本的默认banner
        cp files/etc/banner imagebuilder/files/etc/banner1/
        
        # 临时处理Amlogic通过宝盒插件写入emmc后，根分区变为只读状态的问题
        cp files/etc/rc.local imagebuilder/files/etc/
        
        cd imagebuilder
        echo "启用rootfs.tar.gz配置并停用非必要配置"
        sed -i 's/# CONFIG_TARGET_ROOTFS_TARGZ is not set/CONFIG_TARGET_ROOTFS_TARGZ=y/' .config
        sed -i "s|CONFIG_TARGET_ROOTFS_SQUASHFS=.*|# CONFIG_TARGET_ROOTFS_SQUASHFS is not set|g" .config
        sed -i "s|CONFIG_TARGET_IMAGES_GZIP=.*|# CONFIG_TARGET_IMAGES_GZIP is not set|g" .config
        echo "打印action目录结构"
        tree -L 1

    - name: 🧱 构建 iStoreOS-rootfs
      working-directory: ./imagebuilder
      run: |
        echo "打印imagebuilder目录结构"
        tree -L 1
        echo "打印repositories"
        cat repositories.conf
        #echo "打印Makefile"
        #cat Makefile |grep here
        bash ./build24.sh

    - name: 📦 打印产出 Rootfs
      run: |
        echo "打印bin目录"
        ls -lah imagebuilder/bin/targets/armsr/armv8/

    - name: 🚀 上传到 Release
      uses: softprops/action-gh-release@v2.2.1
      with:
        tag_name: iStoreOS-${{ env.VERSION }}-RELEASE-${{ env.NETWORK_SETTINGS }}
        body: |
          📌 版本： iStoreOS-${{ env.VERSION }}-RELEASE（imagebuilder构建，插件集成与官方一致）
          
          📂 来源： https://fw.koolcenter.com/iStoreOS/ib/armsr/
          
          🧠 内核： Please Login to iStoreOS → System → Amlogic Service → Replace the Kernel
          
          🧩 集成： 包含了基础系统组件、驱动、网络工具、容器支持、LuCI界面及插件等
          
          👤 用户名： root
          
          🔒 密码： 无
          
          🌐 IP： ${{ env.NETWORK_SETTINGS == 'static' && env.IPADDR || '单网口-动态获取（从上级路由找寻）；多网口-IP：192.168.100.1' }}
        files: |
          imagebuilder/bin/targets/armsr/armv8/*generic-rootfs.tar.gz
      env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    - name: 🚀 触发 St2 打包固件
      if: success()
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/dispatches" \
          -d '{"event_type":"istoreos-build"}'
        echo "已发送 repository_dispatch 触发 St2"
